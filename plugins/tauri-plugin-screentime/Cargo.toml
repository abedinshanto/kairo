[package]
name = "tauri-plugin-screentime"
version = "0.1.0"
description = "Reads per-app foreground usage from the OS (Android UsageStatsManager). Data never leaves the device."
edition = "2021"
rust-version = "1.77"
links = "tauri-plugin-screentime"
license = "MIT"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
