[package]
name = "kairo"
version = "0.3.0"
description = "Kairo — private, on-device focus timer and time intelligence"
authors = ["Kairo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kairo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-screentime = { path = "../plugins/tauri-plugin-screentime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
active-win-pos-rs = "0.11"
user-idle = "0.6"
# On-device dictation: Whisper (whisper.cpp) and the microphone.
whisper-rs = { version = "0.16", default-features = false }
cpal = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject", "NSDictionary", "NSData", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }

[target.'cfg(windows)'.dependencies]
png = "0.17"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
time = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
